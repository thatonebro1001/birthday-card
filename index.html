<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Birthday Card Unlock</title>
<style>
  body {
    margin: 0;
    height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: radial-gradient(circle at top, #ffecd2, #fcb69f);
    font-family: "Poppins", sans-serif;
    perspective: 1200px;
  }

  #unlock-box {
    background: white;
    padding: 20px 30px;
    border-radius: 12px;
    box-shadow: 0 10px 25px rgba(0,0,0,0.2);
    text-align: center;
    margin-bottom: 40px;
  }

  #unlock-box input {
    padding: 10px;
    width: 220px;
    border-radius: 8px;
    border: 1px solid #aaa;
    font-size: 15px;
    margin-top: 10px;
  }

  #unlock-box button {
    margin-top: 12px;
    padding: 10px 20px;
    border: none;
    background: #ff7b7b;
    color: white;
    border-radius: 8px;
    font-size: 15px;
    cursor: pointer;
  }

  #error-message {
    margin-top: 10px;
    color: red;
    font-weight: bold;
    display: none;
  }

  #card-container {
    opacity: 0;
    transform: scale(0.2) rotateY(90deg);
    transition: all 1s ease;
    pointer-events: none;
  }

  .scene {
    width: 320px;
    height: 220px;
    position: relative;
  }

  .card {
    width: 100%;
    height: 100%;
    position: relative;
    transform-style: preserve-3d;
    transition: transform 0.9s cubic-bezier(0.23, 1, 0.32, 1);
    cursor: pointer;
  }

  .scene:hover .card {
    transform: rotateY(-160deg);
  }

  .card-face {
    position: absolute;
    width: 100%;
    height: 100%;
    border-radius: 16px;
    box-shadow: 0 18px 40px rgba(0, 0, 0, 0.25);
    backface-visibility: hidden;
    overflow: hidden;
  }

  .card-front {
    background: linear-gradient(135deg, #ff9a9e, #fecfef);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    color: #3b1f2b;
  }

  .card-front h1 {
    font-size: 28px;
    letter-spacing: 2px;
    text-transform: uppercase;
    margin-bottom: 18px;
  }

  .cake {
    position: relative;
    width: 120px;
    height: 120px;
  }

  .layer {
    position: absolute;
    left: 50%;
    transform: translateX(-50%);
    border-radius: 12px;
  }

  .layer.bottom {
    bottom: 10px;
    width: 120px;
    height: 40px;
    background: #ffb347;
    box-shadow: 0 6px 0 rgba(0, 0, 0, 0.15);
  }

  .layer.middle {
    bottom: 40px;
    width: 100px;
    height: 32px;
    background: #ffcc33;
    box-shadow: 0 6px 0 rgba(0, 0, 0, 0.15);
  }

  .layer.top {
    bottom: 66px;
    width: 80px;
    height: 26px;
    background: #ffe680;
    box-shadow: 0 6px 0 rgba(0, 0, 0, 0.15);
  }

  .candle {
    position: absolute;
    bottom: 92px;
    left: 50%;
    transform: translateX(-50%);
    width: 10px;
    height: 32px;
    background: #fff;
    border-radius: 4px;
  }

  .flame {
    position: absolute;
    bottom: 120px;
    left: 50%;
    transform: translateX(-50%);
    width: 16px;
    height: 24px;
    background: radial-gradient(circle at 30% 0%, #fff, #ffd700 40%, #ff8c00 70%);
    border-radius: 50%;
    animation: flicker 0.8s infinite alternate;
  }

  @keyframes flicker {
    0% { transform: translateX(-50%) scale(1); opacity: 0.9; }
    100% { transform: translateX(-50%) scale(1.1); opacity: 1; }
  }

  .card-back {
    background: #fff;
    transform: rotateY(180deg);
    padding: 24px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    color: #333;
  }

  .card-back h2 {
    font-size: 22px;
    margin-bottom: 10px;
    color: #ff6f61;
  }

  .card-back p {
    font-size: 15px;
    line-height: 1.5;
    margin-bottom: 16px;
  }

  .emoji {
    font-size: 32px;
    text-align: center;
  }

  .hint {
    position: absolute;
    bottom: -32px;
    width: 100%;
    text-align: center;
    font-size: 13px;
    color: rgba(60, 40, 40, 0.8);
  }
</style>
</head>
<body>

<div id="unlock-box">
  <h3>Enter Passcode</h3>
  <input id="passcode" placeholder="Type here..." />
  <button onclick="unlock()">Unlock</button>
  <div id="error-message">Incorrect!</div>
</div>

<script>
  function unlock() {
    const input = document.getElementById("passcode").value.trim().toLowerCase();
    const correct = "who's birthday is it?";

    if (input === correct.toLowerCase()) {
      const card = document.getElementById("card-container");
      card.style.opacity = "1";
      card.style.transform = "scale(1) rotateY(0deg)";
      card.style.pointerEvents = "auto";

      document.getElementById("unlock-box").style.display = "none";
    } else {
      document.getElementById("error-message").style.display = "block";
    }
  }
</script>

<div id="card-container">
  <div class="scene">
    <div class="card">
      <div class="card-face card-front">
        <h1>Happy Birthday</h1>
        <div class="cake">
          <div class="layer bottom"></div>
          <div class="layer middle"></div>
          <div class="layer top"></div>
          <div class="candle"></div>
          <div class="flame"></div>
        </div>
      </div>

      <div class="card-face card-back">
        <h2>Wishing You Joy 🎉</h2>
        <p>May your day be filled with laughter, warm hugs, and all your favorite things, Chotka.</p>
        <div class="emoji">🎂🎁✨</div>
      </div>
    </div>
    <div class="hint">Hover or tap to open the card</div>
  </div>
</div>

</body>
</html>
